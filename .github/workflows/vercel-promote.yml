name: Vercel Promote

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Preview deployment URL to promote
        required: true
        type: string

jobs:
  promote:
    name: Promote preview to production
    runs-on: ubuntu-latest

    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Promote deployment
        run: pnpm dlx vercel promote "${{ inputs.deployment_url }}" --yes --token="${{ secrets.VERCEL_TOKEN }}"
